name: Build and Release

on:
  workflow_dispatch:
    inputs:
      release_description:
        description: "Release notes (shown on the GitHub release page)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  check-version:
    name: Allocate release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prev_version: ${{ steps.previous.outputs.prev_version }}
    steps:
      - name: Checkout dispatch commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run unit and release-script tests
        run: npm test

      - name: Allocate the next patch version once
        id: version
        run: |
          VERSION=$(node scripts/prepare-build.js --next-version)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Allocated release version: $VERSION"

      - name: Fail if release or tag already exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$VERSION" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "::error::Release $VERSION already exists."
            exit 1
          fi
          if git ls-remote --exit-code --refs origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "::error::Git tag $VERSION already exists."
            exit 1
          fi

      - name: Find previous release
        id: previous
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREV=$(gh release list --repo "${{ github.repository }}" --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)
          echo "prev_version=$PREV" >> "$GITHUB_OUTPUT"

  build-windows:
    name: Build Windows
    needs: check-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Build
        run: npm run build:win -- --publish never
        env:
          RECODR_BUILD_VERSION: ${{ needs.check-version.outputs.version }}
      - name: Verify packaged version and names
        run: node scripts/verify-build.js "${{ needs.check-version.outputs.version }}" windows
      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: release/*.exe
          if-no-files-found: error

  build-mac:
    name: Build macOS universal
    needs: check-version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Build universal app
        run: npm run build:mac -- --universal --publish never
        env:
          RECODR_BUILD_VERSION: ${{ needs.check-version.outputs.version }}
      - name: Verify packaged version and names
        run: node scripts/verify-build.js "${{ needs.check-version.outputs.version }}" mac
      - uses: actions/upload-artifact@v4
        with:
          name: mac-artifacts
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error

  build-linux:
    name: Build Linux
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install system dependencies
        run: sudo apt-get install -y fakeroot
      - run: npm ci
      - name: Build
        run: npm run build:linux -- --publish never
        env:
          RECODR_BUILD_VERSION: ${{ needs.check-version.outputs.version }}
      - name: Verify packaged version and names
        run: node scripts/verify-build.js "${{ needs.check-version.outputs.version }}" linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  create-release:
    name: Publish GitHub Release
    needs: [check-version, build-windows, build-mac, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Verify release artifact set and names
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          shopt -s nullglob
          files=(artifacts/*)
          test "${#files[@]}" -ge 6 || { echo "Expected artifacts from all platforms"; exit 1; }
          for file in "${files[@]}"; do
            name=$(basename "$file")
            [[ "$name" == "reCodr-$VERSION-windows-"* || "$name" == "reCodr-$VERSION-mac-"* || "$name" == "reCodr-$VERSION-linux-"* ]] || {
              echo "Unexpected artifact name: $name"; exit 1;
            }
          done
          printf '%s\n' "${files[@]}"
      - name: Build release notes
        env:
          RELEASE_NOTES: ${{ github.event.inputs.release_description }}
          PREV_VERSION: ${{ needs.check-version.outputs.prev_version }}
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          printf '%s' "$RELEASE_NOTES" > /tmp/notes.md
          if [ -n "$PREV_VERSION" ]; then
            printf '\n\n**Full Changelog**: https://github.com/%s/compare/%s...%s\n' \
              "${{ github.repository }}" "$PREV_VERSION" "$VERSION" >> /tmp/notes.md
          fi
      - name: Publish release on the dispatch commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          gh release create "$VERSION" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "reCodr $VERSION" \
            --notes-file /tmp/notes.md \
            artifacts/*
